<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- PWA Primary -->
  <link rel="icon" type="image/png" href="/logo2.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />

  <!-- iOS PWA (iPhone/iPad) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Wasit Kheir" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- iOS Splash Screens (iPhone sizes) -->
  <link rel="apple-touch-startup-image"
    media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    href="/apple-touch-icon.png" />
  <link rel="apple-touch-startup-image"
    media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
    href="/apple-touch-icon.png" />
  <link rel="apple-touch-startup-image"
    media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)"
    href="/apple-touch-icon.png" />

  <!-- Mobile Web -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Wasit Kheir" />
  <meta name="description" content="Wasit Kheir - Lost & Found Platform" />

  <title>Wasit Kheir</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">

  <style>
    /* ── Splash Screen ── */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      font-family: 'Cairo', sans-serif;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #splash-logo {
      width: 130px;
      height: 130px;
      object-fit: contain;
      animation: splash-pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    #splash-title {
      font-size: 26px;
      font-weight: 700;
      color: #1e3a5f;
      letter-spacing: 0.5px;
      animation: splash-fadein 0.7s ease 0.2s both;
    }

    /* Spinner */
    #splash-spinner {
      width: 40px;
      height: 40px;
      border: 3.5px solid #e2eaf5;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: splash-spin 0.85s linear infinite, splash-fadein 0.7s ease 0.4s both;
    }

    @keyframes splash-pop {
      0%   { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }

    @keyframes splash-fadein {
      0%   { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0);   }
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <!-- Splash screen — visible before React mounts -->
  <div id="splash">
    <img id="splash-logo" src="/logo2.png" alt="Wasit Kheir" />
    <div id="splash-title">Wasit Kheir</div>
    <div id="splash-spinner"></div>
  </div>

  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
